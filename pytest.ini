[pytest]
testpaths =
    tests
    src/scripts/mixar/modules/space_mixie_chat/tests
    src/scripts/mixar/modules/paint/layered_build/tests
    src/scripts/mixar/modules/paint/procedural_materials/tests
pythonpath = src/scripts
# a passed test's tmp_path is removed at the end of the session (a full client run left ~25 GB otherwise); a failed one is kept to look at
tmp_path_retention_policy = failed
norecursedirs =
    .git
    build
    source
