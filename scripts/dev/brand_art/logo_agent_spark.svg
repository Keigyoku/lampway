<!-- Agent avatar concept "Spark": replaces the black-cat avatar on the agent pill and the Parallel Agents cards.
     Four states drawn side by side: idle, working (a second, offset flame frame: alternate the two at 1.6 s, hold still under
     reduced motion), done (steady flame, check), failed (flame out, a grey wisp). The ring carries the worker's colour;
     the six worker colours are in BRAND.md. 64 x 64 per state. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 80" width="576" height="160" role="img" aria-labelledby="t">
  <title id="t">Lampway agent avatar states: idle, working, done, failed</title>
  <style>
    .ring { fill: #161922; stroke: #9EA0F7; stroke-width: 3; }
    .f  { fill: #EDB944; }
    .f2 { fill: #F6CD6B; }
    .ok { fill: none; stroke: #5BC48F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .out { fill: none; stroke: #A9A69D; stroke-width: 2.5; stroke-linecap: round; }
  </style>
  <rect width="288" height="80" fill="#0E1016"/>
  <!-- idle -->
  <g transform="translate(8 8)"><circle class="ring" cx="32" cy="32" r="29"/>
    <path class="f" d="M32 16 C25 25 24 34 32 43 C40 34 39 25 32 16 Z"/></g>
  <!-- working: flame frame 1 solid, frame 2 ghosted -->
  <g transform="translate(80 8)"><circle class="ring" cx="32" cy="32" r="29"/>
    <path class="f" d="M32 14 C24 24 23 35 32 45 C41 35 40 24 32 14 Z"/>
    <path class="f2" opacity=".5" d="M34 18 C28 26 28 34 34 42 C40 34 40 26 34 18 Z"/></g>
  <!-- done -->
  <g transform="translate(152 8)"><circle class="ring" stroke="#5BC48F" cx="32" cy="32" r="29"/>
    <path class="f" d="M32 18 C26 26 25 34 32 41 C39 34 38 26 32 18 Z"/>
    <path class="ok" d="M24 50 L30 55 L41 46"/></g>
  <!-- failed: flame out -->
  <g transform="translate(224 8)"><circle class="ring" stroke="#F0766B" cx="32" cy="32" r="29"/>
    <path class="out" d="M32 44 C28 38 36 34 32 28 C29 24 33 20 32 16"/>
    <circle cx="32" cy="46" r="3" fill="#A9A69D"/></g>
</svg>
