<!-- Lampway splash v2 (contract 02), 1672 x 941, the size the build embeds. The site's hero in the app: the lamp throws a
     pool of light onto the workshop floor (the perspective grid is the viewport's own grid motif) and the path runs off
     to the right under the wordmark. Text is live <text> in the brand faces; the build renders this to splash.png with
     the vendored woff2 files (no system fallback), and fills the version from VERSION. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="t">
  <title id="t">Lampway</title>
  <defs>
    <radialGradient id="pool" cx="430" cy="560" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDB944" stop-opacity=".30"/>
      <stop offset=".35" stop-color="#EDB944" stop-opacity=".12"/>
      <stop offset="1" stop-color="#EDB944" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="520" cy="238" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6CD6B" stop-opacity=".42"/>
      <stop offset="1" stop-color="#EDB944" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="560" width="1672" height="381" fill="url(#fade)"/></mask>
    <pattern id="g" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="none"/></pattern>
  </defs>
  <rect width="1672" height="941" fill="#0E1016"/>
  <rect width="1672" height="941" fill="url(#pool)"/>
  <!-- the floor: lines converge on a vanishing point behind the lamp -->
  <g mask="url(#floorMask)" stroke="#EDB944" stroke-opacity=".28" stroke-width="1.5">
    <path d="M430 560 L-760 941"/><path d="M430 560 L-420 941"/><path d="M430 560 L-90 941"/><path d="M430 560 L230 941"/>
    <path d="M430 560 L560 941"/><path d="M430 560 L880 941"/><path d="M430 560 L1200 941"/><path d="M430 560 L1520 941"/>
    <path d="M430 560 L1850 941"/><path d="M430 560 L2200 941"/>
    <path d="M0 600 H1672" stroke-opacity=".10"/><path d="M0 640 H1672" stroke-opacity=".14"/><path d="M0 696 H1672" stroke-opacity=".18"/>
    <path d="M0 772 H1672" stroke-opacity=".22"/><path d="M0 880 H1672" stroke-opacity=".26"/>
  </g>
  <!-- the way: the ground line of the mark runs on into the path under the type -->
  <path d="M760 690 H1500" stroke="#EDB944" stroke-width="3" stroke-linecap="round" stroke-opacity=".9"/>
  <circle cx="1500" cy="690" r="9" fill="#EDB944"/>
  <circle cx="1500" cy="690" r="22" fill="#EDB944" fill-opacity=".18"/>
  <!-- the mark, 4.6x, the lantern lit -->
  <circle cx="520" cy="238" r="210" fill="url(#halo)"/>
  <g transform="translate(170 -6) scale(4.6)" fill="none" stroke="#ECE8DF" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M30 104 H100"/>
    <path d="M44 104 V50 C44 34 56 26 76 26"/>
    <path d="M76 26 V33" stroke-width="5"/>
    <rect x="64" y="35" width="24" height="36" rx="8" stroke-width="5"/>
    <path d="M76 43 C70 50 69 57 76 64 C83 57 82 50 76 43 Z" fill="#EDB944" stroke="none"/>
  </g>
  <!-- wordmark, monoline -->
  <g transform="translate(770 300) scale(2.2)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ECE8DF"><path d="M14 10 V70"/><circle cx="49" cy="52" r="18"/><path d="M67 34 V70"/><path d="M84 34 V70"/><path d="M84 50 C84 30 110 30 110 50 V70"/><path d="M110 50 C110 30 136 30 136 50 V70"/><path d="M152 34 V94"/><circle cx="170" cy="52" r="18"/></g>
    <g stroke="#EDB944"><path d="M200 34 L212 70 L224 40 L236 70 L248 34"/><circle cx="285" cy="52" r="18"/><path d="M303 34 V70"/><path d="M320 34 L336 68"/><path d="M352 34 L328 94"/></g>
  </g>
  <text x="772" y="586" font-family="Fraunces" font-size="45" font-weight="340" fill="#ECE8DF" letter-spacing="-0.6">Your AI, your subscriptions, your studio.</text>
  <text x="774" y="648" font-family="IBM Plex Mono" font-size="26" fill="#A9A69D">v0.1.0   GPL-3.0-or-later   built on Blender 5.2</text>
  <text x="170" y="852" font-family="IBM Plex Sans" font-size="24" fill="#A9A69D">Independent open-source project, started from the GPL-licensed Mixar client and built on Blender.</text>
  <text x="170" y="888" font-family="IBM Plex Sans" font-size="24" fill="#7D7A73">Not affiliated with or endorsed by Mixar, Adeveda Enterprises Private Limited or the Blender Foundation.</text>
</svg>
