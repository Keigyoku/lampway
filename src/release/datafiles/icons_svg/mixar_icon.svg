<!-- Lampway app icon concept: the crook-lantern mark (draft A) on a Night tile. One orientation, no gradient, no ring-and-disc,
     no blue: it must not read as the Blender icon or the Mixar icon at 16 px or at 1024 px. Corner radius 22% (the platform
     masks apply their own). At 32 px and below use the reduced mark (BRAND.md section 5.6): post, lantern and flame, no glow, no ground line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
