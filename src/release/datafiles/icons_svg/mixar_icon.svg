  <circle cx="148" cy="106" r="58" fill="#EDB944" opacity=".16"/>
  <g transform="translate(12 12) scale(1.78)" fill="none" stroke="#ECE8DF" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M30 104 H100"/>
    <path d="M44 104 V50 C44 34 56 26 76 26"/>
    <path d="M76 26 V33" stroke-width="5"/>
    <rect x="64" y="35" width="24" height="36" rx="8" stroke-width="5"/>
    <path d="M76 43 C70 50 69 57 76 64 C83 57 82 50 76 43 Z" fill="#EDB944" stroke="none"/>
  </g>
</svg>
