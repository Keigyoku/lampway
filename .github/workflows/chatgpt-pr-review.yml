name: ChatGPT plan PR-open review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, chatgpt-review-lampway]
    timeout-minutes: 25
    concurrency:
      group: chatgpt-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Verify adapter is ready
        run: curl --fail --silent --show-error http://127.0.0.1:8787/health/ready
      - name: Review and verify the posted review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: /opt/chatgpt-plan-adapter/.venv/bin/python /opt/chatgpt-plan-adapter/review.py
