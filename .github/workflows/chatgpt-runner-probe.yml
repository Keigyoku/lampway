# Generated from scripts/generate-ephemeral-workflows.py.
name: ChatGPT ephemeral provider probe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ${{ vars.CHATGPT_REVIEW_RUNNER || 'shipfox-2vcpu-ubuntu-2404' }}
    timeout-minutes: 8
    steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          // Provider/artifact capability probe. No ChatGPT/key/package secret is supplied.
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          try {
            if (!process.env.ACTIONS_RUNTIME_TOKEN || !process.env.ACTIONS_RESULTS_URL) throw new Error();
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'chatgpt-probe-'));
            const install = spawnSync('npm', ['install', '--ignore-scripts', '--prefix', directory,
              '@actions/artifact@6.3.1'], {encoding: 'utf8', timeout: 180000});
            if (install.status !== 0) throw new Error();
            fs.writeFileSync(path.join(directory, 'snapshot.enc'), 'synthetic-encrypted-placeholder');
            const source = String.raw`
          import {pathToFileURL} from 'node:url';
          import path from 'node:path';
          const root = process.argv[1];
          const sdk = await import(pathToFileURL(path.join(root, 'node_modules/@actions/artifact/lib/artifact.js')));
          const result = await sdk.default.uploadArtifact('chatgpt-provider-probe-' + process.env.GITHUB_RUN_ID,
            [path.join(root, 'snapshot.enc')], root, {retentionDays: 90, compressionLevel: 0});
          process.stdout.write('\nPROBE_RECEIPT=' + JSON.stringify({id: result.id}) + '\n');
          `;
            const upload = spawnSync(process.execPath, ['--input-type=module', '-e', source, directory],
              {encoding: 'utf8', timeout: 180000, env: process.env});
            const matches = [...upload.stdout.matchAll(/^PROBE_RECEIPT=(.+)$/gm)];
            if (upload.status !== 0 || matches.length !== 1) throw new Error();
            const id = JSON.parse(matches[0][1]).id;
            if (!Number.isSafeInteger(id) || id <= 0) throw new Error();
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.getArtifact({owner, repo, artifact_id: id});
            if (data.workflow_run.id !== Number(process.env.GITHUB_RUN_ID) || data.expired) throw new Error();
            // Verify immediate API visibility while the producing job is still running.
            core.info('Run-scoped artifact upload and immediate REST metadata read-back verified: ' + id);
            core.info('Runner: ' + process.env.RUNNER_NAME + '; architecture: ' + process.env.RUNNER_ARCH);
            fs.rmSync(directory, {recursive: true, force: true});
          } catch {
            core.setFailed('Provider/artifact probe failed; no credentials were supplied.');
          }
