[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lampway-server"
version = "0.0.1"
description = "Lampway's own backend for the forked Mixar client: login, agent WebSocket, and the Blender-driving agent loop."
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=12",
    "anthropic>=0.60",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "python-multipart>=0.0.9",     # the asset-search and handwriting endpoints take multipart/form-data
    "pillow>=10",                  # the asset-search image features (colour histograms of the previews)
    "numpy>=1.26",                 # the Asset Vault's vectors and shape descriptors, the video gates, the fal pre-flight
    "keyring>=25",                 # Connections keeps the keys Lampway holds in the OS keyring (decision C6)
    "secretstorage>=3.3; sys_platform == 'linux'",   # keyring's Secret Service backend on Linux (decision C6)
]

[project.optional-dependencies]
# the Asset Vault's bundled embedding models (CLIP ViT-B/32, bge-small) run on the CPU through ONNX Runtime; verified with onnxruntime 1.30.0
local-embeddings = [
    "onnxruntime>=1.20",
    "numpy>=2",
]
test = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pyte>=0.8,<0.9",             # the real pane screen and transcript tests
    "websockets>=12",
]

[project.scripts]
lampway-server = "lampway_server.__main__:main"
lampway-hermes-mcp = "lampway_server.pane_mcp:main"
lampway-pane-mcp = "lampway_server.pane_mcp:main"

[tool.setuptools.packages.find]
include = ["lampway_server*"]

[tool.setuptools.package-data]
# data files the code reads from its own package directory (the built-in prompt templates, the library migrations, the decisions goldens)
"*" = ["*.json", "*.sql", "*.md", "*.html", "*.css", "*.js", "*.toml", "*.lua", "*.ttf", "*.txt", "*.woff2", "*.svg"]   # the cockpit page; the terminal add-on's pins and config; the brand pages' faces and mark

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 60
tmp_path_retention_policy = "failed"   # a passed test's tmp_path is removed at session end; a failed one is kept
