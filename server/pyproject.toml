[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lampway-server"
version = "0.0.1"
description = "Lampway's own backend for the forked Mixar client: login, agent WebSocket, and the Blender-driving agent loop."
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=12",
    "anthropic>=0.60",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-timeout>=2",
    "websockets>=12",
]

[project.scripts]
lampway-server = "lampway_server.__main__:main"

[tool.setuptools.packages.find]
include = ["lampway_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 60
