<!-- The cockpit window (facelift contract 10): served by Lampway's own server, from its own origin only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Cockpit - Lampway</title>
<link rel="stylesheet" href="/app/workbench/static/tokens.css">
<link rel="stylesheet" href="/app/workbench/static/cockpit.css">
<script src="/app/workbench/static/cockpit.js" defer></script>
</head>
<body>
<header><img class="mark" src="/app/workbench/static/lockup.svg" alt="Lampway"><h1>Cockpit</h1><span id="server"></span><span id="terminal"></span></header>
<div id="banner" hidden></div>
<main>
  <nav id="sessions" aria-label="Sessions"></nav>
  <section id="pane" aria-label="Terminal">
    <div id="head"></div>
    <pre id="screen"></pre>
    <form id="input" hidden><input id="text" autocomplete="off" aria-label="Type to the session"><button>Send</button></form>
    <p id="refused" hidden></p>
  </section>
  <aside id="cards" aria-label="Report cards"><h2>Report cards</h2><ul id="card-list"></ul><iframe id="card" title="Report card" hidden
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe></aside>
</main>
</body>
</html>
